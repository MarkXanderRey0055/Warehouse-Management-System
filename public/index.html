<!DOCTYPE html>
<html>
<head>
    <title>WMS Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-box">

    <h1>Warehouse Management System</h1>

    <input
        type="email"
        id="email"
        placeholder="Email">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button onclick="login()">
        Login
    </button>

    <p id="message"></p>

</div>

<script src="app.js"></script>

</body>
</html>
